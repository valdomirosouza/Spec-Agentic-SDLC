6. Write the file. Report: new version + rationale, files that need propagation, suggested
   commit message `docs(governance): amend constitution to vX.Y.Z (…)`, and `Next Actions`.

## Done when

- [ ] `memory/constitution.md` written with a valid version line and Sync Impact Report
- [ ] Dependent templates/skills updated or listed as follow-ups
- [ ] No protected article weakened
