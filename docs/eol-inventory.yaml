# docs/eol-inventory.yaml
# Reviewed quarterly. Owner: platform-team.
# Update trigger: any dependency change or new EOL announcement.

schema_version: "1.0"
last_reviewed: "2026-11-14" # prepared in #186; signed off when platform-team approves the PR
next_review_due: "2027-02-12"
owner: platform-team

runtimes:
  - name: Python
    version: "3.13"
    eol_date: "2029-10-31"
    status: active # active | approaching (< 6 months) | eol
    action_if_eol: Upgrade runtime and rebuild all Docker images

  - name: Java (OpenJDK)
    version: "21"
    eol_date: "2031-09-30"
    status: active
    action_if_eol: Migrate to next LTS and update all Spring Boot dependencies

  - name: Go
    version: "1.24"
    eol_date: "2026-02-11" # endoflife.date/go; was recorded as 2026-08-01
    status: eol # 1.24 left support when 1.26 shipped; upgrade is due
    action_if_eol: Upgrade Go toolchain and rebuild event-worker

  - name: Node.js
    version: "22"
    eol_date: "2027-04-30"
    status: approaching # under six months on 2026-11-14
    action_if_eol: Upgrade Node.js version in Dockerfile and devcontainer

frameworks:
  - name: FastAPI
    version: "0.136.3"
    eol_date: null # No fixed EOL — track major version deprecations
    status: active
    action_if_eol: Upgrade to latest stable

  - name: Spring Boot
    version: "3.4.5"
    eol_date: "2025-12-31" # OSS support end (3.4.13 was the last OSS release); was recorded as 2026-11-21
    status: eol # commercial support reportedly to 2026-12-31 — uncertain, verify at spring.io/support-policy
    action_if_eol: Migrate to next supported minor version

  - name: Next.js
    version: "15.2.4"
    eol_date: "2026-10-21" # two years of maintenance LTS from 15.0 (third-party trackers); was recorded as 2026-10-01 — verify
    status: eol
    action_if_eol: Upgrade to next major, verify HITL UI compatibility

infrastructure:
  - name: PostgreSQL
    version: "16"
    eol_date: "2028-11-09"
    status: active
    action_if_eol: Upgrade RDS engine version, run migration tests

  - name: Redis
    version: "7"
    eol_date: "2027-01-31" # unchanged; no source found that confirms it for ElastiCache — verify
    status: approaching # tracking redis:7 (7.4.x); under six months on 2026-11-14
    action_if_eol: Upgrade ElastiCache engine version

  - name: Apache Kafka
    version: "3.8" # Confluent Platform 7.8.0 ships Apache Kafka 3.8
    eol_date: "2026-12-02" # Confluent standard end of support for CP 7.8.x (Platinum: 2027-12-02); was recorded as 2026-10-01
    status: approaching
    action_if_eol: Upgrade broker and Schema Registry versions together

  - name: Kubernetes (EKS)
    version: "1.32"
    eol_date: "2026-03-23" # EKS end of standard support; extended support to 2027-03-23 at extra cost; was recorded as 2026-12-28 — verify with `aws eks describe-cluster-versions`
    status: eol # in extended support at best
    action_if_eol: Upgrade EKS cluster version via Terraform, test Helm chart compatibility
