# adopter-paths: names paths or commands provided by the adopting product repository — see docs/reference/adopter-provided-paths.md
# Scheduled corpus measurement (issues #72, #74). Owner: SRE Lead · Co-owner: DevOps Lead.
#
# Why this file exists. A level is earned by repetition, and repetition nobody schedules does not
# happen. Five assessment rounds produced one observation per control while a note said "monthly"
# and nothing fired.
#
# Why it was rewritten one round later. The first version could not find anything: it compared
# against the newest report, which check-corpus forces to equal the live numbers on every commit.
# It also measured without a token, so the report it archived silently lost its CI rows, and it
# never brought the dated report back into the repository, so a second data point could not exist.
#
# What it deliberately does not do: merge, release, deploy, or push to a protected branch
# (Constitution V). It measures, proposes the report on a topic branch, and files what moved. A
# human lands both.

name: corpus-measure

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      threshold:
        description: "Percent a number must move to be reported"
        required: false
        default: "1.0"
      baseline_age_days:
        description: "How old the baseline report must be"
        required: false
        default: "7"

permissions:
  contents: write # a topic branch only; main is protected and never written here
  pull-requests: write
  issues: write

jobs:
  measure:
    name: measure the corpus and report what moved
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job level, not step level. The first version declared the token only on the step that filed
    # the issue, so `gh run list` failed inside the measurement and the archived report lost its
    # CI rows with nothing able to notice — those are the rows --check deliberately ignores (#74).
    env:
      GH_TOKEN: ${{ github.token }}
      DRIFT_BODY: ${{ github.workspace }}/drift-body.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit history is an input to the measurement

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Drift BEFORE report. --report writes a file dated today; generating first would add a
      # baseline zero days old and the comparison would have to refuse.
      - name: What moved since the last old-enough report
        id: drift
        run: |
          set +e
          python3 scripts/python/corpus_metrics.py --drift \
            --threshold "${{ github.event.inputs.threshold || '1.0' }}" \
            --baseline-age-days "${{ github.event.inputs.baseline_age_days || '7' }}" \
            --body-out "$DRIFT_BODY"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Whether a delta was actually produced. An unhandled exception also exits 1, and
          # branching on the code alone would have filed a "numbers moved" issue for a traceback,
          # with the fallback text in the body (#81).
          if [ -s "$DRIFT_BODY" ]; then echo "body=yes" >> "$GITHUB_OUTPUT";
          else echo "body=no" >> "$GITHUB_OUTPUT"; fi

      - name: Regenerate the dated report
        run: python3 scripts/python/corpus_metrics.py --report

      - name: Keep the report even if the pull request is never landed
        uses: actions/upload-artifact@v4
        with:
          name: corpus-metrics-${{ github.run_id }}
          path: docs/sre/corpus-metrics-*.md
          retention-days: 90

      # Without this the series never forms: every run would archive a report nobody lands, and
      # next week there would still be exactly one dated report and nothing to compare against.
      - name: Propose the dated report
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain docs/sre)" ]; then
            echo "report unchanged; nothing to propose"
            exit 0
          fi
          stamp=$(date -u +%Y-%m-%d)
          branch="chore/corpus-metrics-$stamp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/sre/corpus-metrics-*.md
          git commit -m "chore(sre): corpus measurement $stamp"
          git push --force-with-lease origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(sre): corpus measurement $stamp" \
              --body "Adds the dated measurement so a periodic comparison has a baseline to read next week. Generated by \`.github/workflows/corpus-measure.yml\`; the workflow does not merge (Constitution V)."
          fi

      # Three outcomes, three behaviours. The first version filed one issue whenever the exit code
      # was non-zero, under a fixed title reading "numbers moved" — including for exit 2, which
      # means nothing was compared at all. While the series forms that is the ONLY issue the job
      # can produce, so its title would have been false every time, and a title is all most people
      # see in an issue list. Same family as the withdrawn 160x claim: a confident statement nobody
      # observed, generated by a template (Constitution IX).
      - name: File what moved
        if: steps.drift.outputs.rc == '1' && steps.drift.outputs.body == 'yes'
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/issue.md"
          {
            cat "$DRIFT_BODY"
            echo
            echo "Regenerated report is attached to [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and proposed as a pull request."
            echo
            echo "Opened by \`.github/workflows/corpus-measure.yml\`. The workflow measures, proposes and reports; it does not merge (Constitution V)."
          } > "$body_file"
          open=$(gh issue list --label corpus-drift --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$body_file"
          else
            gh label create corpus-drift --color 1F5F6B --description "A corpus number moved" --force >/dev/null 2>&1 || true
            gh issue create --title "Corpus measurement: numbers moved ($(date -u +%Y-%m-%d))" \
              --label corpus-drift --body-file "$body_file"
          fi

      # Expected while the series forms, so it says that rather than raising an alarm. It is still
      # recorded, because an inability to compare that lasts for months is itself the finding.
      - name: Note that no comparison was possible
        if: steps.drift.outputs.rc == '2'
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/baseline.md"
          {
            echo "No published report is old enough to serve as a baseline, so nothing was compared."
            echo "**Numbers did not move; they were not measured against anything.**"
            echo
            echo "This is expected while the series forms: the comparison needs a report older than"
            echo "the one this run produces. It stops once a dated report has been landed and aged."
            echo
            # Cause and symptom belong in the same place. Without this, a series that stalls because
            # nobody merges the measurement pull requests reports only that no baseline exists, and
            # the reader has no way to connect the two (#87).
            pending=$(gh pr list --state open --search "chore(sre): corpus measurement in:title" \
                        --json number,title,createdAt \
                        --jq '.[] | "- #\(.number) \(.title) — opened \(.createdAt[0:10])"' || true)
            if [ -n "$pending" ]; then
              echo "**Measurement pull requests still open.** The series cannot form until these land:"
              echo
              echo "$pending"
              echo
              echo "That is the cause of this note, not a separate problem."
            else
              echo "No measurement pull request is waiting, so nothing is blocked: the reports"
              echo "landed and simply are not old enough yet."
            fi
            echo
            echo "Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > "$body_file"
          open=$(gh issue list --label corpus-baseline --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$body_file"
          else
            gh label create corpus-baseline --color 8A6212 --description "The periodic comparison had no baseline" --force >/dev/null 2>&1 || true
            gh issue create --title "Corpus measurement: no baseline old enough yet ($(date -u +%Y-%m-%d))" \
              --label corpus-baseline --body-file "$body_file"
          fi

      # Anything else is the measurement itself having broken. Fail loudly in Actions rather than
      # filing an issue that describes a result nobody obtained.
      - name: Fail if the measurement did not run cleanly
        if: steps.drift.outputs.rc != '0' && steps.drift.outputs.rc != '2' && steps.drift.outputs.body != 'yes'
        run: |
          echo "corpus_metrics.py --drift exited ${{ steps.drift.outputs.rc }} without producing a delta." >&2
          echo "That is the measurement failing, not a corpus number moving. See the step log above." >&2
          exit 1
