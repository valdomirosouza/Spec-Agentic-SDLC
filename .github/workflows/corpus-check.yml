# Corpus validation (issue #12). Owner: DevOps Lead (CLAUDE.md §8).
# Runs the deterministic corpus checks on every push and pull request. No application code is
# built here — this is the documentation corpus's own gate.
name: corpus-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    name: check-corpus.sh · markdownlint · high-risk guard
    runs-on: ubuntu-latest
    # 10 was written in round 5 without analysis and nearly drove a four-hundred-line refactor of
    # the verifier to fit it. The harness pays one full verifier run per proof and now carries 40,
    # which is ~5.7 min of CI; this job is a corpus check on push and is not latency-critical, so
    # the honest move is to raise a number nobody had reasoned about rather than optimise code
    # around it (R10-T2). Developers have the fast paths: --no-smoke (~7s) and --no-suites (~60s).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: check-corpus.sh (links · frontmatter · ADR index · scripts · guard)
        run: bash scripts/bash/check-corpus.sh

      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.17.2

      - name: high-risk-action guard self-test
        run: python3 .claude/hooks/verify-high-risk-guard.py
